name: SelectApp
options:
  bundleIdPrefix: com.selectapp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: SelectApp
    INFOPLIST_KEY_LSUIElement: YES

targets:
  SelectApp:
    type: application
    platform: macOS
    dependencies:
      - package: KeyboardShortcuts
    sources:
      - path: SelectApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selectapp.SelectApp
        INFOPLIST_FILE: SelectApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SelectApp/Resources/SelectApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
          CODE_SIGN_ENTITLEMENTS: SelectApp/Resources/SelectApp.entitlements
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
    configFiles:
      Debug: Config/Debug.xcconfig

  SelectAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SelectAppTests
    dependencies:
      - target: SelectApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.selectapp.SelectAppTests
        PRODUCT_NAME: SelectAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SelectApp.app/Contents/MacOS/SelectApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
    configFiles:
      Debug: Config/Debug.xcconfig
